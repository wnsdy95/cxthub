# Post-merge tier of the PostgreSQL contracts. The required PR tier (CI) runs every test that
# is not listed in scripts/ci-heavy-tests.txt once, without the race detector. This workflow
# runs the listed heavy store tests and every app and transport contract under the race
# detector three times, plus the race-only restart and admission checks.
#
# Heavy lanes run serially, as before the split, so their timing assertions see the same
# conditions; the app lane is sharded across jobs instead.
#
# It runs after every main push, nightly, on demand, and on pull requests labelled ci:full.
# It does not gate merges or repository distribution. Main merges require up-to-date
# branches, so a red run on main affects every open PR: revert or fix forward first.
name: CI heavy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-heavy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  heavy:
    name: heavy (${{ matrix.lane }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    if: >-
      (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) &&
      (github.event_name != 'schedule' || github.repository == 'wnsdy95/cxthub')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lane: [app]
        shard: [1/4, 2/4, 3/4, 4/4]
        include:
          - lane: store
          - lane: transports
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cxt
          POSTGRES_PASSWORD: cxt
          POSTGRES_DB: cxthub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cxt"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CXT_TEST_DSN: postgres://cxt:cxt@localhost:5432/cxthub_test?sslmode=disable
      CXT_ROOT_WRITER_COST: "1"
      TIER: heavy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: backend/go.sum
      - name: test (PG ${{ matrix.lane }} contracts, heavy tier)
        working-directory: backend
        env:
          LANE: ${{ matrix.lane }}
          SHARD: ${{ matrix.shard }}
          COUNT: ${{ matrix.lane == 'store' && '1' || '3' }}
        run: bash ../scripts/ci-backend-contracts.sh "$LANE"
