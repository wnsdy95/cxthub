name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push to the same pull request supersedes its older run. Main runs are
  # never cancelled because repository distribution follows each successful main run.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests skip suites their changes cannot affect. Main pushes always run
  # everything. If this job fails, every gated job still runs (the conditions below
  # only skip on an explicit "false") and the required backend check fails.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.scope.outputs.go }}
      web: ${{ steps.scope.outputs.web }}
    steps:
      # A pull_request run checks out the test merge commit; its first parent is the
      # base tip, so HEAD^1..HEAD is exactly the change that would be merged.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Classify changed paths
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          go=true web=true
          if [ "$EVENT" = pull_request ]; then
            go=false web=false
            files="$(git diff --no-renames --name-only HEAD^1 HEAD)"
            while IFS= read -r file; do
              case "$file" in
                "") ;;
                docs/*) ;;                    # documentation only
                */*) case "$file" in
                       frontend/web/*) web=true ;;
                       *) go=true web=true ;;
                     esac ;;
                *.md) ;;                      # root-level Markdown only
                *) go=true web=true ;;
              esac
            done <<< "$files"
            printf 'Changed paths:\n%s\n' "$files"
          fi
          printf 'go=%s\nweb=%s\n' "$go" "$web" | tee -a "$GITHUB_OUTPUT"

  public-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: false
      - name: Install public-check dependencies
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Verify public checks reject a missing dependency
        run: |
          status=0
          result="$(PATH=/nonexistent /bin/bash scripts/public-preflight.sh tree 2>&1)" || status=$?
          test "$status" -eq 1
          test "$result" = "[public-check] required dependency is missing: rg (ripgrep)"
      # "full" runs every "tree" check and then scans the complete public history,
      # so a public repository needs only the single full pass.
      - name: Validate the publishable tree and complete public history
        env:
          MODE: ${{ github.event.repository.private == false && 'full' || 'tree' }}
        run: bash scripts/public-preflight.sh "$MODE"
      - name: Verify local dogfood auth resolution
        run: bash scripts/test-dogfood-daemon.sh
      - name: Verify independent local service lifecycle
        run: python3 scripts/test-local-services.py
      - name: Verify bounded Go test batches
        run: python3 scripts/test-test-go-batches.py
      - name: Verify Go test batch outcomes
        run: python3 scripts/test-go-batches-outcomes.py
      - name: Verify fail-closed public Git metadata checks
        run: python3 scripts/test-check-public-git-metadata.py
      - name: Verify repository export and synchronization fences
        run: python3 scripts/test-distribute-repositories.py
      - name: Verify E2E publication fence and failure evidence
        run: |
          python3 scripts/test-e2e-drain-publication.py
          python3 scripts/test-e2e-collect-diagnostics.py
          python3 scripts/test-e2e-repair-proof.py
          python3 scripts/test-e2e-wrapper-proof.py
          python3 scripts/test-e2e-wrapper-gate.py

  backend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: backend/go.sum
      - name: build (both tags)
        working-directory: backend
        run: |
          go build ./...
          go build -tags postgres ./...
      - name: vet
        working-directory: backend
        run: go vet ./... && go vet -tags postgres ./internal/adapters/store/
      - name: test (FS) + openapi drift guard
        working-directory: backend
        run: go test ./...
      # The race-detector variant of this check runs in CI heavy.
      - name: test admission progress on one CPU
        working-directory: backend
        env:
          GOMAXPROCS: "1"
        run: go test ./internal/app -run '^TestResourceAdmission(DispatchReservesBothClasses|MixedGraphVerification)$' -count=3 -timeout=120s
      - name: vulnerability scan (FS and production PostgreSQL)
        working-directory: backend
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -tags postgres ./...
      # The backend and mcp distributions export the same backend/ and schemas/
      # trees, so the standalone server source is built and vetted once.
      - name: Export standalone server sources
        run: |
          for component in backend mcp; do
            python3 scripts/distribute-repositories.py export --ref HEAD --component "$component" --output "$RUNNER_TEMP/$component"
          done
          diff -r "$RUNNER_TEMP/backend/backend" "$RUNNER_TEMP/mcp/backend"
          diff -r "$RUNNER_TEMP/backend/schemas" "$RUNNER_TEMP/mcp/schemas"
      - name: Build standalone server source
        working-directory: ${{ runner.temp }}/backend/backend
        run: go build -tags postgres ./... && go vet -tags postgres ./...

  # Required PR tier: every PostgreSQL contract that is not listed in
  # scripts/ci-heavy-tests.txt runs once, without the race detector. Store and app are
  # sharded across runners, and each shard runs two workers that each own a freshly
  # created database. On a 4-vCPU runner shared with PostgreSQL, four workers only gave a
  # ~1.3x speedup, because the tests are CPU-bound, so extra runners scale better.
  # Transport tests run serially: their HTTP requests wait at most 1 s for an in-process
  # admission permit, and CPU contention from parallel test processes turned that into 503
  # responses. The listed heavy tests and the race-detector repetitions run in "CI heavy"
  # (main pushes, nightly, ci:full PRs).
  backend-contracts:
    name: backend-contracts (${{ matrix.lane }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: store, shard: 1/4, workers: "2" }
          - { lane: store, shard: 2/4, workers: "2" }
          - { lane: store, shard: 3/4, workers: "2" }
          - { lane: store, shard: 4/4, workers: "2" }
          - { lane: app, shard: 1/2, workers: "2" }
          - { lane: app, shard: 2/2, workers: "2" }
          - { lane: transports, workers: "1" }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cxt
          POSTGRES_PASSWORD: cxt
          POSTGRES_DB: cxthub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cxt"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CXT_TEST_DSN: postgres://cxt:cxt@localhost:5432/cxthub_test?sslmode=disable
      CXT_ROOT_WRITER_COST: "1"
      TIER: fast
      WORKERS: ${{ matrix.workers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: backend/go.sum
      - name: test (PG ${{ matrix.lane }} contracts, fast tier)
        working-directory: backend
        env:
          LANE: ${{ matrix.lane }}
          SHARD: ${{ matrix.shard }}
        run: bash ../scripts/ci-backend-contracts.sh "$LANE"

  backend:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [changes, backend-checks, backend-contracts]
    steps:
      - name: Require all backend jobs to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GO_CHANGED: ${{ needs.changes.outputs.go }}
        run: |
          jq -e --arg go "$GO_CHANGED" '
            keys == ["backend-checks", "backend-contracts", "changes"] and .changes.result == "success" and
            (if $go == "false" then all(.["backend-checks"], .["backend-contracts"]; .result == "skipped")
             else all(.["backend-checks"], .["backend-contracts"]; .result == "success") end)' <<< "$NEEDS_JSON"

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: false
      - name: vulnerability scan
        working-directory: cli
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Verify cross-module contracts explicitly
        working-directory: cli
        run: go test -tags monorepo ./internal/domain -count=1
      # The CLI is built, vetted and tested once, as the exported standalone public
      # repository, which is exactly the source tree that distribution publishes.
      - name: Export committed CLI source into an isolated root
        run: python3 scripts/distribute-repositories.py export --ref HEAD --component cli --output "$RUNNER_TEMP/component"
      - name: build · vet · test (standalone CLI)
        working-directory: ${{ runner.temp }}/component
        run: |
          go build ./...
          go vet ./...
          go test $(go list ./... | grep -v '/internal/adapters/delivery/cli$')
          python3 scripts/test-go-batches.py ./internal/adapters/delivery/cli/

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: install · unit test · i18n check · typecheck · build
        working-directory: frontend/web
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run check:architecture
          npm run check:i18n
          npm run check:vercel
          npx tsc --noEmit
          npx vite build
      - name: Export committed frontend source into an isolated root
        run: python3 scripts/distribute-repositories.py export --ref HEAD --component frontend --output "$RUNNER_TEMP/component"
      - name: Validate standalone frontend
        working-directory: ${{ runner.temp }}/component
        run: |
          npm ci
          npm run test:unit
          npm run check:architecture
          npm run check:i18n
          npm run check:vercel
          npm run build

  web-browser-e2e:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cxt
          POSTGRES_PASSWORD: cxt
          POSTGRES_DB: cxthub_browser_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cxt"
          --health-interval 5s --health-timeout 5s --health-retries 10
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: backend/go.sum
      - name: Install web dependencies
        working-directory: frontend/web
        run: npm ci
      - name: Install Chromium
        working-directory: frontend/web
        run: npx playwright install chromium --with-deps
      - name: Browser UI E2E
        working-directory: frontend/web
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2 --workers=1
        env:
          CXT_E2E_FULLSTACK: "1"
          CXT_E2E_DSN: postgres://cxt:cxt@localhost:5432/cxthub_browser_test?sslmode=disable
      - name: Windowed document combined candidate
        if: matrix.shard == 1
        working-directory: frontend/web
        run: npm run test:e2e -- e2e/document-combined-adoption.spec.ts --project=chromium --workers=1
        env:
          CXT_DOCUMENT_WINDOW: "1"
      - name: Upload Playwright failure report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: frontend/web/playwright-report/
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: |
            backend/go.sum
            cli/go.sum
      - name: e2e (real binary startup — FS store, full surface)
        run: make e2e

  e2e-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cxt
          POSTGRES_PASSWORD: cxt
          POSTGRES_DB: cxthub_sync
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cxt"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: |
            backend/go.sum
            cli/go.sum
      - name: Allocate private synchronization diagnostics
        id: sync-diagnostics
        run: |
          diagnostics_root=$(mktemp -d "$RUNNER_TEMP/cxt-sync-diagnostics.XXXXXX") || exit 1
          printf 'root=%s\n' "$diagnostics_root" >> "$GITHUB_OUTPUT"
      - name: Synchronized E2E deep dive (append/graft · memory promotion · session boundary · fetch-only)
        env:
          CXT_E2E_DIAGNOSTICS_DIR: ${{ steps.sync-diagnostics.outputs.root }}/fs
        run: make e2e-sync
      - name: Production PostgreSQL CLI push/pull and hook contracts
        env:
          CXT_E2E_DSN: postgres://cxt:cxt@localhost:5432/cxthub_sync?sslmode=disable
          CXT_E2E_DIAGNOSTICS_DIR: ${{ steps.sync-diagnostics.outputs.root }}/postgres
        run: |
          CXT_LOAD_DSN="$CXT_E2E_DSN" go test -C backend -tags postgres ./internal/adapters/delivery/http -run '^TestPostgresDocumentPipeline$' -count=1 -v
          CXT_LOAD_DSN="$CXT_E2E_DSN" go test -C backend -tags postgres ./internal/adapters/delivery/http -run '^TestPostgresDocPublicationContention$' -count=1 -v -timeout=10m
          make e2e-sync
      - name: Preserve allowlisted synchronization failure evidence
        if: failure() && steps.sync-diagnostics.outputs.root != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synchronization-diagnostics
          path: |
            ${{ steps.sync-diagnostics.outputs.root }}/fs/
            ${{ steps.sync-diagnostics.outputs.root }}/postgres/
          if-no-files-found: ignore
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deployment image build validation (no push)
        run: |
          docker build -f deploy/Dockerfile -t cxtd:preflight .
          docker build -f deploy/Dockerfile.mcp -t cxt-mcp:preflight .
          docker build -f deploy/Dockerfile.migrate -t cxt-migrate:preflight .
          bash scripts/deploy-preflight.sh images

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render Blueprint contract (no provisioning)
        run: |
          python3 -m pip install -r deploy/requirements-preflight.txt
          python3 scripts/check-render-blueprint.py
      # Provider packages and their checksum files are served from GitHub release assets, and a
      # GitHub 504 there failed this required check. A warm cache leaves init with only the
      # registry.terraform.io version lookups. Terraform still checks each cached package against
      # the h1 hashes in the lock file, so a cache entry cannot change which provider is installed.
      - name: Restore Terraform provider cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/terraform-plugin-cache
          key: terraform-providers-${{ runner.os }}-1.15.8-${{ hashFiles('deploy/terraform/.terraform.lock.hcl') }}
      - name: Terraform fmt · provider lock · schema/input tests (no apply)
        run: |
          mkdir -p "$RUNNER_TEMP/terraform-data" "$RUNNER_TEMP/terraform-plugin-cache"
          # init links providers from the cache, so every command mounts it at the same path.
          tf() {
            docker run --rm \
              -e TF_DATA_DIR=/tmp/terraform-data \
              -e TF_PLUGIN_CACHE_DIR=/tmp/terraform-plugin-cache \
              -v "$PWD/deploy/terraform:/workspace:ro" \
              -v "$RUNNER_TEMP/terraform-data:/tmp/terraform-data" \
              -v "$RUNNER_TEMP/terraform-plugin-cache:/tmp/terraform-plugin-cache" \
              -w /workspace \
              hashicorp/terraform:1.15.8@sha256:7ae513256f7ce67879e218ae8593d6fbe216ec9e123abe6c94e4e10704857963 "$@"
          }
          tf fmt -check -recursive
          # A cold cache still downloads from GitHub, so retry init across a short outage.
          for attempt in 1 2 3; do
            if tf init -backend=false -input=false -lockfile=readonly; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "::warning::terraform init failed (attempt $attempt of 3); retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          tf validate
          tf test
      - name: Signed GitHub webhook operator tests
        run: bash scripts/test-github-webhook.sh
