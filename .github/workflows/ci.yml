name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: false
      - name: Validate the publishable tree
        run: bash scripts/public-preflight.sh tree
      - name: Verify local dogfood auth resolution
        run: bash scripts/test-dogfood-daemon.sh
      - name: Verify independent local service lifecycle
        run: python3 scripts/test-local-services.py
      - name: Verify E2E publication fence and failure evidence
        run: |
          python3 scripts/test-e2e-drain-publication.py
          python3 scripts/test-e2e-collect-diagnostics.py
          python3 scripts/test-e2e-repair-proof.py
      - name: Validate the complete public history
        if: github.event.repository.private == false
        run: bash scripts/public-preflight.sh full

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cxt
          POSTGRES_PASSWORD: cxt
          POSTGRES_DB: cxthub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cxt"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: backend/go.sum
      - name: build (both tags)
        working-directory: backend
        run: |
          go build ./...
          go build -tags postgres ./...
      - name: vet
        working-directory: backend
        run: go vet ./... && go vet -tags postgres ./internal/adapters/store/
      - name: test (FS) + openapi drift guard
        working-directory: backend
        run: go test ./...
      - name: vulnerability scan (FS and production PostgreSQL)
        working-directory: backend
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -tags postgres ./...
      - name: test (PG contracts — real Postgres)
        working-directory: backend
        env:
          CXT_TEST_DSN: postgres://cxt:cxt@localhost:5432/cxthub_test?sslmode=disable
        run: |
          go test -tags postgres ./internal/adapters/store/ -timeout=120s -v
          go test -tags postgres ./internal/app/ -race -run '^TestPG' -count=3 -timeout=120s -v
          go test -tags postgres ./internal/adapters/delivery/http/ -race -run '^TestPG' -count=3 -timeout=120s -v
          go test -tags postgres ./internal/adapters/federation/ -race -run '^TestPG' -count=3 -timeout=120s -v
          go test -tags postgres ./internal/mcpserver/ -race -run '^TestPG' -timeout=120s -v

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: false
      - name: build · vet · test
        working-directory: cli
        run: go build ./... && go vet ./... && go test ./...
      - name: vulnerability scan
        working-directory: cli
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: install · unit test · i18n check · typecheck · build
        working-directory: frontend/web
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run check:architecture
          npm run check:i18n
          npm run check:vercel
          npx tsc --noEmit
          npx vite build

  web-browser-e2e:
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cxt
          POSTGRES_PASSWORD: cxt
          POSTGRES_DB: cxthub_browser_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cxt"
          --health-interval 5s --health-timeout 5s --health-retries 10
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: backend/go.sum
      - name: Install web dependencies
        working-directory: frontend/web
        run: npm ci
      - name: Install Chromium
        working-directory: frontend/web
        run: npx playwright install chromium --with-deps
      - name: Browser UI E2E
        working-directory: frontend/web
        run: npm run test:e2e
        env:
          CXT_E2E_FULLSTACK: "1"
          CXT_E2E_DSN: postgres://cxt:cxt@localhost:5432/cxthub_browser_test?sslmode=disable
      - name: Upload Playwright failure report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: frontend/web/playwright-report/
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: backend/go.sum
      - name: e2e (real binary startup — FS store, full surface)
        run: make e2e

  e2e-sync:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cxt
          POSTGRES_PASSWORD: cxt
          POSTGRES_DB: cxthub_sync
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cxt"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: backend/go.sum
      - name: Allocate private synchronization diagnostics
        id: sync-diagnostics
        run: |
          diagnostics_root=$(mktemp -d "$RUNNER_TEMP/cxt-sync-diagnostics.XXXXXX") || exit 1
          printf 'root=%s\n' "$diagnostics_root" >> "$GITHUB_OUTPUT"
      - name: Synchronized E2E deep dive (append/graft · memory promotion · session boundary · fetch-only)
        env:
          CXT_E2E_DIAGNOSTICS_DIR: ${{ steps.sync-diagnostics.outputs.root }}/fs
        run: make e2e-sync
      - name: Production PostgreSQL CLI push/pull and hook contracts
        env:
          CXT_E2E_DSN: postgres://cxt:cxt@localhost:5432/cxthub_sync?sslmode=disable
          CXT_E2E_DIAGNOSTICS_DIR: ${{ steps.sync-diagnostics.outputs.root }}/postgres
        run: |
          CXT_LOAD_DSN="$CXT_E2E_DSN" go test -C backend -tags postgres ./internal/adapters/delivery/http -run '^TestPostgresDocumentPipeline$' -count=1 -v
          CXT_LOAD_DSN="$CXT_E2E_DSN" go test -C backend -tags postgres ./internal/adapters/delivery/http -run '^TestPostgresDocPublicationContention$' -count=1 -v -timeout=10m
          make e2e-sync
      - name: Preserve allowlisted synchronization failure evidence
        if: failure() && steps.sync-diagnostics.outputs.root != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synchronization-diagnostics
          path: |
            ${{ steps.sync-diagnostics.outputs.root }}/fs/
            ${{ steps.sync-diagnostics.outputs.root }}/postgres/
          if-no-files-found: ignore
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deployment image build validation (no push)
        run: |
          docker build -f deploy/Dockerfile -t cxtd:preflight .
          docker build -f deploy/Dockerfile.mcp -t cxt-mcp:preflight .
          bash scripts/deploy-preflight.sh images

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render Blueprint contract (no provisioning)
        run: |
          python3 -m pip install -r deploy/requirements-preflight.txt
          python3 scripts/check-render-blueprint.py
      - name: Terraform fmt · provider lock · schema/input tests (no apply)
        run: |
          mkdir -p "$RUNNER_TEMP/terraform-data"
          docker run --rm \
            -e TF_DATA_DIR=/tmp/terraform-data \
            -v "$PWD/deploy/terraform:/workspace:ro" \
            -v "$RUNNER_TEMP/terraform-data:/tmp/terraform-data" \
            -w /workspace \
            hashicorp/terraform:1.15.8@sha256:7ae513256f7ce67879e218ae8593d6fbe216ec9e123abe6c94e4e10704857963 fmt -check -recursive
          docker run --rm \
            -e TF_DATA_DIR=/tmp/terraform-data \
            -v "$PWD/deploy/terraform:/workspace:ro" \
            -v "$RUNNER_TEMP/terraform-data:/tmp/terraform-data" \
            -w /workspace \
            hashicorp/terraform:1.15.8@sha256:7ae513256f7ce67879e218ae8593d6fbe216ec9e123abe6c94e4e10704857963 init -backend=false -input=false -lockfile=readonly
          docker run --rm \
            -e TF_DATA_DIR=/tmp/terraform-data \
            -v "$PWD/deploy/terraform:/workspace:ro" \
            -v "$RUNNER_TEMP/terraform-data:/tmp/terraform-data" \
            -w /workspace \
            hashicorp/terraform:1.15.8@sha256:7ae513256f7ce67879e218ae8593d6fbe216ec9e123abe6c94e4e10704857963 validate
          docker run --rm \
            -e TF_DATA_DIR=/tmp/terraform-data \
            -v "$PWD/deploy/terraform:/workspace:ro" \
            -v "$RUNNER_TEMP/terraform-data:/tmp/terraform-data" \
            -w /workspace \
            hashicorp/terraform:1.15.8@sha256:7ae513256f7ce67879e218ae8593d6fbe216ec9e123abe6c94e4e10704857963 test
      - name: Signed GitHub webhook operator tests
        run: bash scripts/test-github-webhook.sh
