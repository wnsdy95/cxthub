# Repetition of the race-checked PostgreSQL contracts. CI runs every contract once on
# each pull request and main push; this workflow repeats the app and transport lanes
# three times under the race detector to surface nondeterminism without blocking merges
# or repository distribution. Run it manually before a release or a risky rollout.
name: CI stress

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-stress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  race-repetition:
    name: race-repetition (${{ matrix.lane }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    if: github.repository == 'wnsdy95/cxthub' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lane: [app]
        shard: [1/4, 2/4, 3/4, 4/4]
        include:
          - lane: transports
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cxt
          POSTGRES_PASSWORD: cxt
          POSTGRES_DB: cxthub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cxt"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CXT_TEST_DSN: postgres://cxt:cxt@localhost:5432/cxthub_test?sslmode=disable
      CXT_ROOT_WRITER_COST: "1"
      COUNT: "3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: backend/go.sum
      - name: test (PG ${{ matrix.lane }} contracts, 3 repetitions)
        working-directory: backend
        env:
          LANE: ${{ matrix.lane }}
          SHARD: ${{ matrix.shard }}
        run: bash ../scripts/ci-backend-contracts.sh "$LANE"
