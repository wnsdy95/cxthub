name: Distribute repositories

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  eligible:
    if: >-
      github.repository == 'wnsdy95/cxthub' &&
      vars.REPOSITORY_SYNC_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm source main and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('distribution', 'scripts/distribute-repositories.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.check_source_eligibility(module.revision(Path.cwd(), 'HEAD'))
          PY

  synchronize:
    needs: eligible
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: repository-distribution
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.10"
          cache: false
      - name: Install pinned secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: sync-auth
        with:
          app-id: ${{ vars.REPOSITORY_SYNC_APP_ID }}
          private-key: ${{ secrets.REPOSITORY_SYNC_APP_PRIVATE_KEY }}
          owner: wnsdy95
          repositories: cxthub-cli,cxthub-backend,cxthub-frontend,cxthub-mcp
          permission-contents: write
          permission-workflows: write
      - name: Resolve publisher bot identity
        id: publisher
        env:
          GH_TOKEN: ${{ steps.sync-auth.outputs.token }}
          APP_SLUG: ${{ steps.sync-auth.outputs.app-slug }}
        run: |
          [[ "$APP_SLUG" =~ ^[a-z0-9-]+$ ]]
          bot_id="$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          [[ "$bot_id" =~ ^[0-9]+$ ]]
          printf 'name=%s[bot]\nemail=%s+%s[bot]@users.noreply.github.com\n' "$APP_SLUG" "$bot_id" "$APP_SLUG" >> "$GITHUB_OUTPUT"
      - name: Publish verified component set
        env:
          GH_TOKEN: ${{ steps.sync-auth.outputs.token }}
          SOURCE_GITHUB_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: ${{ steps.publisher.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.publisher.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.publisher.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.publisher.outputs.email }}
        run: python3 scripts/distribute-repositories.py publish --ref HEAD > "$RUNNER_TEMP/repository-release-set.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-release-set
          path: ${{ runner.temp }}/repository-release-set.json
          retention-days: 90
