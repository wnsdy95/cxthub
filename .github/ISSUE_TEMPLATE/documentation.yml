name: Documentation
description: Report missing, inaccurate, or unclear public documentation.
title: "docs: "
labels: [documentation, triage]
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: Link to the page, file, command output, or section.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is missing, inaccurate, or difficult to follow.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: This report contains no credentials or private context.
          required: true
