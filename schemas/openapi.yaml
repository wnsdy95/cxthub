tags:
  - name: repos
    description: Repo registration and retrieval.
  - name: manifest
    description: "Manifest for push/pull negotiation (have/want 1st step)."
  - name: branches
    description: Convenience branch retrieval.
  - name: snapshots
    description: "commit metadata. The body and natural parents are immutable, while the hash outside projection/overlay is updated using a CAS. Creation is only allowed via the push/objects path."
  - name: docs
    description: "content-addressed blob (SessionDoc/CIR). Creation is only allowed via the push/objects path."
  - name: refs
    description: "HEAD/branch/session pointers and immutable tags. Ref movement uses CAS; cxt/branch-state/v1 tags carry branch lifecycle events."
  - name: memories
    description: "snapshot attachment MemoryDigest."
  - name: push
    description: "Push negotiation in three stages (negotiate → objects → bounded ref batch, with single-ref fallback for older servers)."
  - name: pull
    description: "Pull negotiation (manifest GET → pull/objects → local ref merge)."
  - name: actions
    description: "common use-case actions for web UI / CLI (diff / fork / load)."
  - name: assets
    description: "repo team assets — About / team settings bundle / E2E secret envelope / commit attachment settings object."
  - name: identity
    description: "authentication (session exchange) · account (username/nickname) · CLI token."
  - name: repositories
    description: "repository settings (publicity/policy/GitHub sync) · members (5 roles) · invite · ownership transfer."
  - name: organizations
    description: "Global Organization namespace, separate 3-role administration plane, enforced policy, audit, and owner-only break-glass."
