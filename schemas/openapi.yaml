  /enterprises/{enterpriseID}/saml:
    get:
      summary: Read SAML connection and current browser verification
      description: Enterprise and linked organization members only. No private keys or identity subjects are returned. Unconfigured operators return available=false.
      parameters:
        - {name: enterpriseID, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SAMLView'}
        '401': {description: Current browser login required}
        '403': {description: Enterprise authority required}
        '409': {description: Stale revision or domain observation}
        '422': {description: Unsupported or invalid configuration}
        '429': {description: Rate limited}
        '503': {description: Identity service unavailable}
    post:
      summary: Configure SAML (Enterprise owner)
      description: Verified company domain and current revision required. Pinned IdP XML is validated, the SP signing key is encrypted outside PostgreSQL, and owner/domain/revision are rechecked with audit in one transaction. Existing keys are preserved across metadata updates. No membership grants.
      parameters:
        - {name: enterpriseID, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SAMLConnectionInput'}
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SAMLView'}
        '401': {description: Current browser login required}
        '403': {description: Enterprise authority required}
        '409': {description: Stale revision or domain observation}
        '422': {description: Unsupported or invalid configuration}
        '429': {description: Rate limited}
        '503': {description: Identity service unavailable}
  /enterprises/{enterpriseID}/saml/signing:
    post:
      summary: Transition SP signing-certificate rollover (Enterprise owner)
      description: Revision-checked prepare, confirmed activation, cancellation, rollback or retirement. Retirement requires a current-revision completed browser flow. No private keys are returned. Authority, state and audit commit atomically.
      security: [{SessionCookie: []}, {BearerToken: []}]
      parameters:
        - {in: path, name: enterpriseID, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SAMLSigningInput'}
      responses:
        '200':
          description: Updated public signing state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SAMLView'}
        '422': {description: Invalid action, unconfirmed activation or unusable signing material}
        '429': {description: Rate limited}
        '401': {description: Authentication required}
        '403': {description: Enterprise owner required}
        '404': {description: Connection not found}
        '409': {description: Stale revision or invalid lifecycle transition}
        '503': {description: Identity connection unavailable}
  /enterprises/{enterpriseID}/saml/disable:
    post:
      summary: Disable SAML (Enterprise owner)
      description: Revision checked. Existing identity and audit records are retained.
      parameters:
        - {name: enterpriseID, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [revision], properties: {revision: {type: string}}}
      responses:
        '200':
          description: Successful operation
        '401': {description: Current browser login required}
        '403': {description: Enterprise authority required}
        '409': {description: Stale revision or domain observation}
        '422': {description: Unsupported or invalid configuration}
        '429': {description: Rate limited}
        '503': {description: Identity service unavailable}
  /enterprises/{enterpriseID}/saml/authorize:
    post:
      summary: Start SP-initiated SAML browser verification
      description: Signed redirect request with persistent NameID and ForceAuthn. Browser login is required; initial explicit linking requires login within ten minutes. No CLI or MCP token approval.
      parameters:
        - {name: enterpriseID, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {type: object, properties: {url: {type: string}}}
        '401': {description: Current browser login required}
        '403': {description: Enterprise authority required}
        '409': {description: Stale revision or domain observation}
        '422': {description: Unsupported or invalid configuration}
        '429': {description: Rate limited}
        '503': {description: Identity service unavailable}
  /auth/enterprise/saml/{enterpriseID}/metadata:
    get:
      summary: Read public SP metadata for a configured SAML connection
      security: []
      parameters:
        - {name: enterpriseID, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: SP signing certificate and implemented redirect/POST profile (no private key)
          content:
            application/samlmetadata+xml:
              schema: {type: string}
        '404': {description: No configured connection}
        '409': {description: Domain observation expired}
        '429': {description: Rate limited}
        '503': {description: Identity service unavailable}
  /auth/enterprise/saml/{enterpriseID}/acs:
    post:
      summary: Stage a signed SAML proof without cookie authority
      description: Bounded form POST. Requires durable RelayState and signed assertion/request correlation. Atomically consumes the assertion and stages a two-minute completion ticket. Does not link or authenticate an account until completion in the initiating browser. Raw assertions are discarded. This exact endpoint is exempt from cookie CSRF checks because it never uses cookie authority.
      security: []
      parameters:
        - {name: enterpriseID, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [SAMLResponse, RelayState]
              additionalProperties: false
              properties:
                SAMLResponse: {type: string, description: Base64 signed plaintext assertion response}
                RelayState: {type: string, minLength: 64, maxLength: 64}
      responses:
        '303': {description: Same-origin completion redirect (no-store and no-referrer)}
        '401': {description: Verification failed; restart from Enterprise page}
        '429': {description: Rate limited}
        '503': {description: Identity service unavailable}
  /auth/enterprise/saml/finish:
    get:
      summary: Complete SAML in the initiating authenticated browser
      description: Requires the same browser credential as the start. Rechecks membership, domain, connection revision and session in the identity transaction, then records binding, proof, ticket consumption and audit together. CLI and MCP credentials gain no approval. Mandatory SSO remains disabled.
      parameters:
        - {name: ticket, in: query, required: true, schema: {type: string, minLength: 64, maxLength: 64}}
      responses:
        '303': {description: Enterprise identity page}
        '401': {description: Expired, replayed or wrong-browser completion; no authority change}
        '429': {description: Rate limited}
        '503': {description: Identity service unavailable}

  /enterprises/{enterpriseID}/oidc:
    get:
      summary: Read identity connection and current browser verification
      description: Available to Enterprise members and members of its organizations. No secrets or external subjects are returned. Unconfigured operators return available=false.
      parameters:
        - {name: enterpriseID, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Connection availability and session-specific status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OIDCView'}
        '401': {description: Authentication required}
        '403': {description: Enterprise access required}
    post:
      summary: Configure an OIDC identity provider (Enterprise owner)
      description: Requires a verified company domain. Validates discovery outside the transaction, then rechecks owner/domain/revision and commits encrypted credentials with audit. Email never links accounts; existing session verifications are invalidated by the new revision.
      parameters:
        - {name: enterpriseID, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OIDCConnectionInput'}
      responses:
        '200':
          description: Public connection view
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OIDCView'}
        '401': {description: Authentication required}
        '403': {description: Owner required}
        '409': {description: Stale revision or expired domain observation}
        '422': {description: Invalid provider configuration}
        '429': {description: Rate limited}
        '503': {description: Identity connection unavailable}
  /enterprises/{enterpriseID}/oidc/disable:
    post:
      summary: Disable OIDC and invalidate its session evidence (Enterprise owner)
      description: Requires current revision. Account bindings and audit history remain; this does not alter membership or grant access.
      parameters:
        - {name: enterpriseID, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [revision], properties: {revision: {type: string}}}
      responses:
        '200': {description: Connection disabled}
        '401': {description: Authentication required}
        '403': {description: Owner required}
        '409': {description: Stale revision}
        '429': {description: Rate limited}
        '503': {description: Identity connection unavailable}
  /enterprises/{enterpriseID}/oidc/authorize:
    post:
      summary: Start OIDC verification for the initiating browser session
      description: Authorization code with S256 PKCE and nonce. A first account link requires a CXTHub browser login within 10 minutes. State is persisted and bound to that session and connection revision; CLI/MCP tokens cannot start this browser flow.
      parameters:
        - {name: enterpriseID, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200':
          description: Provider authorization URL
          content:
            application/json:
              schema: {type: object, properties: {url: {type: string}}}
        '401': {description: Recent browser login required}
        '403': {description: Enterprise access required}
        '409': {description: Connection or domain changed}
        '429': {description: Rate limited}
        '503': {description: Provider or identity connection unavailable}
  /auth/enterprise/oidc/callback:
    get:
      summary: Complete the initiating browser's OIDC verification
      description: Requires its HttpOnly session cookie. Consumes state before exchange, verifies signed identity, rechecks session/membership/connection/domain, and atomically records an explicit issuer/subject binding, session evidence and audit. Grants no membership and does not enable mandatory SSO.
      parameters:
        - {name: state, in: query, required: true, schema: {type: string}}
        - {name: code, in: query, required: true, schema: {type: string}}
      responses:
        '303': {description: Redirect to the recorded Enterprise page}
        '401': {description: Verification not applied; restart with a current login}
        '429': {description: Rate limited}
        '503': {description: Identity connection unavailable}

  /enterprises/{enterpriseID}/domains:
    get:
      summary: List exact-domain DNS observations (Enterprise administrator)
      parameters:
        - {name: enterpriseID, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Server-derived verification state; no login or membership grant
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/EnterpriseDomain'}}
        '401': {description: Authentication required}
        '403': {description: Enterprise administrator required}
        '503': {description: Transactional domain verification unavailable}
    post:
      summary: Create or renew an exact-domain DNS challenge (Enterprise owner)
      description: Empty revision creates a new claim. Existing claims require the observed revision. Challenges expire after 24 hours; renewal retains a still-valid prior observation. Maximum 20 claims per enterprise.
      parameters:
        - {name: enterpriseID, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnterpriseDomainCommand'}
      responses:
        '200':
          description: Challenge created; no change to memberships, identities or access
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnterpriseDomain'}
        '401': {description: Authentication required}
        '403': {description: Enterprise owner required}
        '409': {description: Stale revision or domain limit}
        '422': {description: Invalid DNS name}
        '429': {description: Rate limited}
        '503': {description: Transactional domain verification unavailable}

  /enterprises/{enterpriseID}/domains/verify:
    post:
      summary: Verify DNS TXT and publish a 30-day observation
      description: Rechecks authority and revision after DNS lookup. Only one Enterprise can hold an unexpired observation for the exact name. Parent and child names are independent. This neither merges accounts nor enables SSO.
      parameters:
        - {name: enterpriseID, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnterpriseDomainCommand'}
      responses:
        '200':
          description: Verified observation with a new revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnterpriseDomain'}
        '401': {description: Authentication required}
        '403': {description: Enterprise owner required}
        '404': {description: Challenge released or absent}
        '409': {description: Stale or expired challenge, or another Enterprise holds the domain}
        '422': {description: DNS TXT did not match or name is invalid}
        '429': {description: Rate limited}
        '503': {description: DNS lookup failed or transactional storage unavailable}

  /enterprises/{enterpriseID}/domains/release:
    post:
      summary: Release a domain claim with an audit record (Enterprise owner)
      description: Requires the current revision. Preserves all accounts, context and membership; the owner can create a fresh claim later.
      parameters:
        - {name: enterpriseID, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnterpriseDomainCommand'}
      responses:
        '200':
          description: Claim released and audit committed atomically
          content:
            application/json:
              schema: {type: object, properties: {status: {type: string}}}
        '401': {description: Authentication required}
        '403': {description: Enterprise owner required}
        '404': {description: Claim absent}
        '409': {description: Stale revision}
        '422': {description: Invalid DNS name}
        '429': {description: Rate limited}
        '503': {description: Transactional storage unavailable}

  /enterprises/{enterpriseID}/audit:
    get:
      summary: "Read enterprise administration audit records"
      parameters:
        - {"name": "enterpriseID", "in": "path", "required": true, "schema": {"type": "string"}}
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema: {"type": "array", "items": {"$ref": "#/components/schemas/EnterpriseAuditEvent"}}
        "401":
          description: Authentication required
        "403":
          description: Insufficient permission
        "404":
          description: Record not visible or not found
        "409":
          description: Ownership, policy, or uniqueness conflict
        "422":
          description: Invalid request

  /organizations/{organizationID}/effective-policy:
    get:
      summary: "Read organization policy after enterprise restrictions"
      parameters:
        - {"name": "organizationID", "in": "path", "required": true, "schema": {"type": "string"}}
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/OrganizationPolicy"}
        "401":
          description: Authentication required
        "403":
          description: Insufficient permission
        "404":
          description: Record not visible or not found
        "409":
          description: Ownership, policy, or uniqueness conflict
        "422":
          description: Invalid request

  /organizations/{organizationID}/invitations:
    parameters:
      - name: organizationID
        in: path
        required: true
        schema: {type: string}
    get:
      summary: List invitations for administrators of this space
      responses:
        "200":
          description: Invitations, including expired and cancelled records
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CollaborationInvitation'}
        "403": {description: Current administrator role required}
    post:
      summary: Invite a specific verified account; no email is sent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient]
              properties:
                recipient: {type: string, description: 'Email or @username'}
                role: {type: string, enum: [member, admin, owner], default: member}
                days: {type: integer, minimum: 1, maximum: 30, default: 7}
      responses:
        "200":
          description: Invitation created without granting membership
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CollaborationInvitation'}
        "403": {description: Insufficient current authority to grant this role}
        "409": {description: An unexpired invitation for this recipient already exists}

  /enterprises/{enterpriseID}/invitations:
    parameters:
      - name: enterpriseID
        in: path
        required: true
        schema: {type: string}
    get:
      summary: List invitations for administrators of this space
      responses:
        "200":
          description: Invitations, including expired and cancelled records
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CollaborationInvitation'}
        "403": {description: Current administrator role required}
    post:
      summary: Invite a specific verified account; no email is sent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient]
              properties:
                recipient: {type: string, description: 'Email or @username'}
                role: {type: string, enum: [member, admin, owner], default: member}
                days: {type: integer, minimum: 1, maximum: 30, default: 7}
      responses:
        "200":
          description: Invitation created without granting membership
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CollaborationInvitation'}
        "403": {description: Insufficient current authority to grant this role}
        "409": {description: An unexpired invitation for this recipient already exists}

  /me/invitations:
    get:
      summary: List pending unexpired invitations addressed to the signed-in account
      responses:
        "200":
          description: Recipient inbox
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CollaborationInvitation'}
  /invitations/{invitationID}:
    parameters:
      - name: invitationID
        in: path
        required: true
        schema: {type: string}
    get:
      summary: Read an invitation as its recipient or a space administrator
      responses:
        "200":
          description: Invitation details
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CollaborationInvitation'}
        "404": {description: Not found or not visible to this account}
  /invitations/{invitationID}/{action}:
    parameters:
      - name: invitationID
        in: path
        required: true
        schema: {type: string}
      - name: action
        in: path
        required: true
        schema: {type: string, enum: [accept, decline, revoke, resend]}
    post:
      summary: Accept, decline, cancel, or renew an invitation atomically with membership and audit
      description: Acceptance rechecks the inviter's current authority. Renewing cancels the old ID and creates a new seven-day invitation. A consumed link cannot restore removed membership.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        "200":
          description: Updated invitation, or the new invitation when renewing
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CollaborationInvitation'}
        "403": {description: Wrong recipient or inviter no longer authorized}
        "409": {description: Expired, cancelled, consumed, or conflicting invitation}

  /organizations/{organizationID}/rename:
    parameters:
      - name: organizationID
        in: path
        required: true
        schema: {type: string}
    post:
      summary: Owner renames the space with historical URL aliases retained
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_slug, slug]
              properties:
                expected_slug: {type: string}
                slug: {type: string}
      responses:
        "200":
          description: Canonical navigation target
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: {type: string}
        "403": {description: Space owner required}
        "409": {description: Stale editing baseline or reserved URL}

  /enterprises/{enterpriseID}/rename:
    parameters:
      - name: enterpriseID
        in: path
        required: true
        schema: {type: string}
    post:
      summary: Owner renames the space with historical URL aliases retained
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_slug, slug]
              properties:
                expected_slug: {type: string}
                slug: {type: string}
      responses:
        "200":
          description: Canonical navigation target
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: {type: string}
        "403": {description: Space owner required}
        "409": {description: Stale editing baseline or reserved URL}

  /repositories/{repositoryID}/transfer-namespace:
    parameters:
      - name: repositoryID
        in: path
        required: true
        schema: {type: string}
    post:
      summary: Move a repository between spaces controlled by the caller
      description: Requires personal ownership or Organization Owner on both sides. Retains stable content and repository IDs, historical aliases and direct members. Removes source organization team grants. Public repositories cannot move into organizations forbidding public repositories.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_namespace_id, expected_slug, destination]
              properties:
                expected_namespace_id: {type: string}
                expected_slug: {type: string}
                destination: {type: string, description: Destination personal or organization slug}
      responses:
        "200":
          description: Transferred repository
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Repository'}
        "403": {description: Caller does not control both spaces}
        "409": {description: Stale baseline, destination policy, or URL conflict}

  /me/mcp-applications:
    get:
      summary: List the signed-in user's active MCP applications without token values
      responses:
        "200":
          description: One entry per OAuth client
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/MCPApplication'}
  /me/mcp-applications/{clientID}:
    parameters:
      - name: clientID
        in: path
        required: true
        schema: {type: string}
    delete:
      summary: Revoke all access/refresh tokens and unused authorization codes for this user and client
      responses:
        "200": {description: Revoked with an account audit event; other users and clients are unaffected}
  /me/audit:
    get:
      summary: List the signed-in user's most recent 100 MCP authorization and revocation events
      responses:
        "200":
          description: Account audit records with no token values
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AccountAuditEvent'}

tags:
  - name: repos
    description: Repo registration and retrieval.
  - name: manifest
    description: "Manifest for push/pull negotiation (have/want 1st step)."
  - name: branches
    description: Convenience branch retrieval.
  - name: snapshots
    description: "commit metadata. The body and natural parents are immutable, while the hash outside projection/overlay is updated using a CAS. Creation is only allowed via the push/objects path."
  - name: anchored-sessions
    description: "Reports a CLI computes for coding-agent sessions from the records the agents and Git left behind: where each session is cut at the commits it made. Readable only by the uploading account until a published-by-push rule exists."
  - name: branch-ledger
    description: One permanent record for each lifetime of a branch name on the remote, and the IDs joined to it.
  - name: anchored-notes
    description: What a person wrote about a commit, a branch or a worktree that no session explains. Only its author changes or removes it; who else reads it follows what it was written about.
  - name: worktrees
    description: The working folders of the repository on a member's machines, by name. Readable only by the member who reported them.
  - name: remote-git
    description: The commits, branch heads and pull requests of a repository as the server itself read them from its Git hosting provider.
  - name: docs
    description: "content-addressed blob (SessionDoc/CIR). Creation is only allowed via the push/objects path."
  - name: refs
    description: "HEAD/branch/session pointers and immutable tags. Ref movement uses CAS; cxt/branch-state/v1 tags carry branch lifecycle events."
  - name: memories
    description: "snapshot attachment MemoryDigest."
  - name: push
    description: "Push negotiation in three stages (negotiate → objects → bounded ref batch, with single-ref fallback for older servers)."
  - name: pull
    description: "Pull negotiation (manifest GET → pull/objects → local ref merge)."
  - name: actions
    description: "common use-case actions for web UI / CLI (diff / fork / load)."
  - name: assets
    description: "repo team assets — About / team settings bundle / E2E secret envelope / commit attachment settings object."
  - name: identity
    description: "authentication (session exchange) · account (username/nickname) · CLI token."
  - name: repositories
    description: "repository settings (publicity/policy/GitHub sync) · members (5 roles) · invite · ownership transfer."
  - name: organizations
    description: "Global Organization namespace, separate 3-role administration plane, enforced policy, audit, and owner-only break-glass."
