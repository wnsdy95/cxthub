          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrganizationAuditEvent" }

  /organizations/{organizationID}/break-glass:
    parameters: *organizationIDParam
    post:
      operationId: createBreakGlassGrant
      summary: Create an owner-only, reason-bound, expiring read grant
      description: "The grant is read-only, never mutates Repository membership, and every use is audited."
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repository_id, reason, minutes]
              properties:
                repository_id: { type: string }
                reason: { type: string, minLength: 3, maxLength: 1000 }
                minutes: { type: integer, minimum: 1, maximum: 240 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BreakGlassGrant" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /repositories/{wsID}/notifications:
