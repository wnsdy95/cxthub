  # =========================================================================
  # Repository · Member · Invite
  # =========================================================================
  /repositories:
    post:
      operationId: createRepository
      summary: Create repository (creator = owner member registration)
      tags: [repositories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
    get:
      operationId: listRepositories
      summary: List repositories I belong to
      tags: [repositories]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Repository" }

  /repositories/{wsID}:
    parameters: &wsIDParam
      - name: wsID
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateRepository
      summary: Update repository settings section — owner only
      description: |
        visibility(gh_visibility_sync on = 409 lock), secrets_policy/settings_policy,
        gh_visibility_sync(on = immediate 1-time sync run).
      tags: [repositories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                visibility: { type: string, enum: [private, public] }
                secrets_policy: { type: string, enum: [members, owner] }
                settings_policy: { type: string, enum: [members, owner] }
                gh_visibility_sync: { type: boolean }
                archived: { type: boolean, description: "Archived (read-only) — write 403 for viewers" }
                webhook_url: { type: string, description: "Slack incoming webhook compatible. Empty string = disable" }
                slug: { type: string, description: "Manually change URL segment (unicode allowed, unique within owner 409)" }
                public_role: { type: string, enum: ["", viewer, puller], description: "Public default role for non-members ('' | viewer | puller)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "Manual visibility setting during sync" }
        "422": { description: "Invalid policy value (includes legacy 'list')" }

  /repositories/{wsID}/transfer:
    parameters: *wsIDParam
    post:
      operationId: transferRepository
      summary: Ownership Transfer — Constructor's exclusive rights, only to existing members
      description: |
        The new owner is promoted to owner role, while the original constructor remains as owner role (GitHub style).
        URL changes with OwnerUsername change, appending -2, -3, ... on slug collision.
      tags: [repositories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_user_id]
              properties:
                to_user_id: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        "403": { description: "Not the constructor" }
        "404": { description: "Target is not a member" }

  /repositories/{wsID}/sync-visibility:
    parameters: *wsIDParam
    post:
      operationId: syncVisibility
      summary: Manual GitHub public state sync — owner exclusive
      description: "Public only when all linked GitHub repos are public (404/failure/non-GitHub = private, conservative)."
      tags: [repositories]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        "422": { description: "gh_visibility_sync disabled" }

  /repositories/{wsID}/members:
    parameters: *wsIDParam
    get:
      operationId: listMembers
      summary: Member List (members only)
      tags: [repositories]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Membership" }

  /repositories/{wsID}/members/{userID}:
    parameters:
      - name: wsID
        in: path
        required: true
        schema: { type: string }
      - name: userID
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateMemberRole
      summary: Role Change — owner exclusive, constructor role fixed (409)
      tags: [repositories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/MemberRole" }
      responses:
        "200": { description: updated }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "Attempt to change constructor role" }
    delete:
      operationId: removeMember
      summary: Remove member — owner can do it, self cannot (creator cannot 409)
      tags: [repositories]
      responses:
        "200": { description: removed }
        "409": { description: "Attempt to remove creator" }

  /repositories/{wsID}/invites:
    parameters: *wsIDParam
    get:
      operationId: listInvites
      summary: Invite list — maintainer and above (management screen)
      tags: [repositories]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invite" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createInvite
      summary: Invite link creation — maintainer and above, role assignment possible
      tags: [repositories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                role: { $ref: "#/components/schemas/MemberRole" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invite" }

  /repositories/{wsID}/invites/{token}/revoke:
    parameters:
      - name: wsID
        in: path
        required: true
        schema: { type: string }
      - name: token
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: revokeInvite
      summary: Invalidate invite
      tags: [repositories]
      responses:
        "200": { description: revoked }

  /invites/{token}/accept:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: acceptInvite
      summary: Accept invite — join with role specified in invite (idempotent)
      tags: [repositories]
      responses:
        "200":
          description: "Return joined repository."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        "403": { description: "Email specified invite mismatch" }
        "409": { description: "revoked/expired" }

  # =========================================================================
  # Organization namespace · membership · enforced policy · audit
  # =========================================================================
  /organizations:
    get:
      operationId: listOrganizations
      summary: List Organizations the current user belongs to
      tags: [organizations]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Organization" }
    post:
      operationId: createOrganization
      summary: Create an Organization and globally unique namespace
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                slug: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "409": { description: "Namespace already claimed by a user or Organization." }

  /organizations/{organizationID}:
    parameters: &organizationIDParam
      - name: organizationID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getOrganization
      summary: Get an Organization I belong to
      tags: [organizations]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      operationId: updateOrganizationProfile
      summary: Update Organization display name or logo — admin and above
      description: "The namespace slug is intentionally immutable here; renaming it requires a separate URL migration flow."
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                logo: { type: string, description: "Organization logo data URL, or an empty string to clear it." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /public/organizations/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: publicOrganization
      summary: Public Organization profile and public Repository projection
      tags: [organizations]
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }

  /organizations/{organizationID}/members:
    parameters: *organizationIDParam
    get:
      operationId: listOrganizationMembers
      summary: List Organization members
      tags: [organizations]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrganizationMembership" }

  /organizations/{organizationID}/members/{userID}:
    parameters:
      - name: organizationID
        in: path
        required: true
        schema: { type: string }
      - name: userID
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateOrganizationMember
      summary: Add or update an Organization member
      description: "Admins may add and remove ordinary members only. Promoting, demoting, or removing an Admin or Owner requires an Owner. At least one Owner must remain."
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [member, admin, owner] }
      responses:
        "200": { description: updated }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "The mutation would remove the final Organization Owner." }
    delete:
      operationId: removeOrganizationMember
      parameters:
        - name: repository_access
          in: query
          required: true
          schema: { type: string, enum: [revoke, retain] }
          description: Revoke direct grants or retain outside collaborator access. Team membership is always removed.
      summary: Remove an Organization member
      description: "Admins may remove ordinary members only; Owners manage Admins and Owners. At least one Owner must remain."
      tags: [organizations]
      responses:
        "200": { description: removed }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "The mutation would remove the final Organization Owner." }

  /organizations/{organizationID}/policy:
    parameters: *organizationIDParam
    get:
      operationId: getOrganizationPolicy
      summary: Read enforced Organization policies
      tags: [organizations]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationPolicy" }
    patch:
      operationId: updateOrganizationPolicy
      summary: Update enforced Organization policies (admin or owner)
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                repository_creation: { type: string, enum: [admins, members] }
                default_repository_visibility: { type: string, enum: [private, public] }
                allow_public_repositories: { type: boolean }
                break_glass_enabled: { type: boolean }
                break_glass_max_minutes: { type: integer, minimum: 5, maximum: 240 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationPolicy" }

  /organizations/{organizationID}/repositories:
    parameters: *organizationIDParam
