services:
  - type: web
    name: cxthub-api
    runtime: docker
    repo: https://github.com/wnsdy95/cxthub-backend
    branch: main
    autoDeployTrigger: "off"
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8907"
      - key: CXT_AUTH
        value: firebase
      - key: CXT_FIREBASE_PROJECT
        sync: false
      - key: CXT_PUBLIC_URL
        sync: false
      - key: CXT_COOKIE_SECURE
        value: "1"
      - key: CXT_CORS_ORIGINS
        fromService:
          type: web
          name: cxthub-api
          envVarKey: CXT_PUBLIC_URL
      - key: CXT_POSTGRES_DSN
        fromDatabase:
          name: cxthub-postgres
          property: connectionString
  - type: web
    name: cxthub-mcp
    runtime: docker
    repo: https://github.com/wnsdy95/cxthub-mcp
    branch: main
    autoDeployTrigger: "off"
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8908"
      - key: CXT_AUTH
        value: firebase
      - key: CXT_FIREBASE_PROJECT
        fromService:
          type: web
          name: cxthub-api
          envVarKey: CXT_FIREBASE_PROJECT
      - key: CXT_PUBLIC_URL
        fromService:
          type: web
          name: cxthub-api
          envVarKey: CXT_PUBLIC_URL
      - key: CXT_MCP_PUBLIC_URL
        sync: false
      - key: CXT_POSTGRES_DSN
        fromDatabase:
          name: cxthub-postgres
          property: connectionString
databases:
  - name: cxthub-postgres
    region: singapore
    plan: 0.1c-256mb
    diskSizeGB: 20
    storageAutoscalingEnabled: false
    postgresMajorVersion: "16"
    databaseName: cxthub_postgres
    user: cxthub_postgres_user
    ipAllowList: []
