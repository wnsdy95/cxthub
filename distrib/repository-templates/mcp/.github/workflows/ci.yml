name: MCP Packaging CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            tags: ""
          - variant: postgres
            tags: postgres
    env:
      GO_BUILD_TAGS: ${{ matrix.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build all packages
        working-directory: backend
        run: go build -tags "$GO_BUILD_TAGS" ./...
      - name: Vet all packages
        working-directory: backend
        run: go vet -tags "$GO_BUILD_TAGS" ./...
      - name: Build production binary
        if: matrix.variant == 'postgres'
        working-directory: backend
        run: go build -tags postgres -o ../bin/cxt-mcp ./cmd/cxt-mcp

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build MCP container without publishing
        run: docker build -f Dockerfile -t cxthub-mcp:ci .

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ always() }}
    needs: [build-vet, container]
    steps:
      - name: Require all packaging jobs to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          jq -e 'keys == ["build-vet", "container"] and all(.[]; .result == "success")' <<< "$NEEDS_JSON"
